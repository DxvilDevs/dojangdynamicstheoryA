<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0d12" />
  <title>Black Belt Study</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="appShell" class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">🥋</div>
        <div>
          <strong>Black Belt</strong>
          <span>Study</span>
        </div>
      </div>

      <nav class="nav">
        <button class="nav-item active" data-view="dashboard"><span>⌂</span> Dashboard</button>
        <button class="nav-item" data-view="study"><span>✦</span> Study</button>
        <button class="nav-item" data-view="official"><span>◈</span> Official decks</button>
        <button class="nav-item" data-view="my-decks"><span>＋</span> My stuff</button>
        <button class="nav-item" data-view="progress"><span>◔</span> Progress</button>
      </nav>

      <div class="sidebar-footer">
        <div class="mini-progress">
          <div class="mini-progress-top"><span>Black belt progress</span><strong id="sidebarProgress">0%</strong></div>
          <div class="progress-track"><div class="progress-fill" id="sidebarProgressFill"></div></div>
        </div>
      </div>
    </aside>

    <main class="main" id="main">
      <header class="topbar">
        <button class="mobile-menu" id="mobileMenu">☰</button>
        <div class="crumbs" id="crumbs">Dashboard</div>
        <div class="topbar-actions">
          <button class="ghost-btn" id="authButton">Create your own deck</button>
        </div>
      </header>

      <div id="content" class="content"></div>
    </main>
  </div>

  <div class="modal-backdrop hidden" id="modalBackdrop">
    <div class="modal" id="modal"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
